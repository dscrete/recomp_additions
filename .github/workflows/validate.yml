name: Validate mod

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Lua tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y lua5.4 luajit

      - name: Compile Lua sources
        shell: bash
        run: |
          set -euo pipefail
          luac5.4 -p main.lua
          find src -type f -name '*.lua' -print0 | sort -z | xargs -0 -n1 luac5.4 -p

      - name: Validate manifest JSON
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool manifest.json >/dev/null

      - name: Validate against Gen1Recomp mod API
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch dev https://github.com/bryanthaboi/gen1recomp.git /tmp/gen1recomp
          python3 /tmp/gen1recomp/tools/modkit.py validate "$GITHUB_WORKSPACE" --strict --base fixture

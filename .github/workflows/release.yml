name: Package tagged release

on:
  push:
    branches:
      - main
    paths:
      - .release

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Lua tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y lua5.4 luajit

      - name: Validate sources
        shell: bash
        run: |
          set -euo pipefail
          luac5.4 -p main.lua
          find src -type f -name '*.lua' -print0 | sort -z | xargs -0 -n1 luac5.4 -p
          python3 -m json.tool manifest.json >/dev/null
          git clone --depth 1 --branch dev https://github.com/bryanthaboi/gen1recomp.git /tmp/gen1recomp
          # The ROM-free fixture produces advisory MK305 warnings for files whose
          # names overlap generated datasets, but loader/schema/API errors fail.
          python3 /tmp/gen1recomp/tools/modkit.py validate "$GITHUB_WORKSPACE" --base fixture

      - name: Read release tag
        shell: bash
        run: |
          set -euo pipefail
          tag="$(tr -d '[:space:]' < .release)"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag in .release: $tag" >&2
            exit 1
          fi
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "ZIP_PATH=dist/gen1recomp_expansion-${tag}.zip" >> "$GITHUB_ENV"

      - name: Build installable ZIP
        shell: bash
        run: |
          set -euo pipefail
          stage="dist/gen1recomp_expansion"
          mkdir -p "$stage"

          cp manifest.json main.lua README.md CHANGELOG.md "$stage/"
          cp -R src "$stage/src"
          if [ -d docs ]; then cp -R docs "$stage/docs"; fi
          if [ -f AGENTS.md ]; then cp AGENTS.md "$stage/"; fi

          (
            cd dist
            zip -r "gen1recomp_expansion-${RELEASE_TAG}.zip" gen1recomp_expansion
          )

      - name: Create tagged prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          notes="Automated Kanto Expansion build ${RELEASE_TAG} from commit ${GITHUB_SHA}. Extract the top-level gen1recomp_expansion directory into Gen1Recomp's mods directory."

          gh release create "$RELEASE_TAG" "$ZIP_PATH" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Kanto Expansion ${RELEASE_TAG}" \
            --notes "$notes" \
            --prerelease
